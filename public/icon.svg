<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Simplified dumbbell -->
  <rect x="9" y="14.5" width="14" height="3" rx="1.5" fill="white" opacity="0.95"/>
  <rect x="6" y="12" width="3" height="8" rx="1.2" fill="white" opacity="0.95"/>
  <rect x="23" y="12" width="3" height="8" rx="1.2" fill="white" opacity="0.95"/>
  <!-- Trend line -->
  <polyline points="8,24 13,22 18,23 23,19 27,16" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <!-- FT -->
  <text x="16" y="11" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="7" fill="white" opacity="0.85">FT</text>
</svg>
