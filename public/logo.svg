<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a5b4fc"/>
      <stop offset="100%" style="stop-color:#c4b5fd"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Dumbbell (horizontal bar with plates) -->
  <!-- Center bar -->
  <rect x="140" y="244" width="232" height="24" rx="12" fill="white" opacity="0.95"/>
  <!-- Left plates -->
  <rect x="96" y="206" width="36" height="100" rx="10" fill="white" opacity="0.95"/>
  <rect x="68" y="222" width="24" height="68" rx="8" fill="white" opacity="0.7"/>
  <!-- Right plates -->
  <rect x="380" y="206" width="36" height="100" rx="10" fill="white" opacity="0.95"/>
  <rect x="420" y="222" width="24" height="68" rx="8" fill="white" opacity="0.7"/>
  <!-- Upward trend line (chart) -->
  <polyline points="120,380 200,350 270,360 340,310 410,260" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Trend arrow tip -->
  <polygon points="410,260 398,285 422,278" fill="url(#accent)"/>
  <!-- Small bar chart marks at bottom -->
  <rect x="120" y="392" width="16" height="28" rx="4" fill="white" opacity="0.3"/>
  <rect x="152" y="384" width="16" height="36" rx="4" fill="white" opacity="0.3"/>
  <rect x="184" y="376" width="16" height="44" rx="4" fill="white" opacity="0.3"/>
  <!-- FT text (subtle) -->
  <text x="256" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="72" fill="white" opacity="0.9" letter-spacing="-2">FT</text>
</svg>
